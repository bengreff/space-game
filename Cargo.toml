[package]
name = "sunscatter"
version = "0.1.0"
edition = "2021"

[dependencies]
# Rendering
wgpu = "0.19"
winit = "0.29"
lyon = "1.0"

# UI
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"

# Math
glam = { version = "0.25", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

# Image loading
image = { version = "0.25", default-features = false, features = ["png"] }

# Utilities
pollster = "0.3"  # For blocking on async wgpu
bytemuck = { version = "1.14", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
